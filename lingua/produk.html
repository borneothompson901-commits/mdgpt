        <h1 class="nav-product-title" id="navProductTitle"></h1>
        <span class="nav-mobile-title" aria-hidden="true">Detail Produk</span>

    <main class="page product-detail-page">
      <div class="pd-breadcrumb">
        <div class="pd-breadcrumb__inner">
          <a href="index.html">Katalog</a>
          <span>/</span>
          <span id="pdBreadcrumbTitle" class="pd-breadcrumb__current">Produk</span>
        </div>
      </div>
      <section class="pd-notfound" id="pdNotFound" hidden>
        <div class="pd-notfound__inner">
          <h1>Produk tidak ditemukan</h1>
          <p>Produk yang kamu cari mungkin sudah tidak tersedia atau link-nya salah.</p>
          <a href="index.html" class="pd-notfound__btn">Kembali ke Katalog</a>
        </div>
      </section>
      <section class="pd-detail" id="pdDetail" hidden>
        <div class="pd-detail__inner">
          <div class="pd-gallery">
            <div class="pd-gallery__main">
              <span class="pd-gallery__badge" id="pdBadge" hidden></span>
              <img id="pdMainImage" src="" alt="" />
            </div>
            <div class="pd-gallery__thumbs" id="pdThumbs"></div>
          </div>
          <div class="pd-info">
            <span class="pd-info__category" id="pdCategory">Kategori</span>
            <h1 class="pd-info__title" id="pdTitle">Nama Produk</h1>
            <div class="pd-info__meta">
              <span class="pd-info__rating">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                <span id="pdRating">4.8</span>
              </span>
              <span class="pd-info__dot">&bull;</span>
              <span class="pd-info__sold"><span id="pdSold">0</span> terjual</span>
            </div>
            <div class="pd-info__price">
              <span class="pd-info__price-now" id="pdPriceNow">Rp0</span>
              <span class="pd-info__price-old" id="pdPriceOld" hidden></span>
              <span class="pd-info__discount" id="pdDiscountTag" hidden></span>
            </div>

            <div class="pd-info__qty">
              <span class="pd-info__qty-label">Jumlah</span>
              <div class="pd-qty">
                <button type="button" class="pd-qty__btn" id="pdQtyMinus" aria-label="Kurangi jumlah">&minus;</button>
                <input type="text" class="pd-qty__input" id="pdQtyInput" value="1" readonly aria-label="Jumlah produk" />
                <button type="button" class="pd-qty__btn" id="pdQtyPlus" aria-label="Tambah jumlah">+</button>
              </div>
            </div>
            <div class="pd-info__actions">
              <button type="button" class="pd-btn pd-btn--cart" id="pdAddCartBtn">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                <span>Tambah ke Keranjang</span>
              </button>
              <button type="button" class="pd-btn pd-btn--buy" id="pdBuyNowBtn">Beli Sekarang</button>
            </div>
          </div>
        </div>
        <div class="pd-tabs__wrap">
          <div class="pd-tabs">
            <div class="pd-tabs__section" id="pdTabDeskripsi">
              <h2 class="pd-tabs__heading">Deskripsi</h2>
              <p id="pdDescription"></p>
              <ul id="pdHighlights"></ul>
            </div>
            <div class="pd-tabs__section" id="pdTabSpesifikasi">
              <h2 class="pd-tabs__heading">Spesifikasi</h2>
              <table class="pd-spec-table" id="pdSpecTable"></table>
            </div>
          </div>
        </div>
      </section>
      <section class="pd-related" id="pdRelated" hidden>
        <div class="pd-related__inner">
          <h2 class="pd-related__title">Mungkin Kamu Suka...</h2>
          <div class="explore-grid" id="pdRelatedGrid"></div>
          <a href="index.html" class="pd-related__viewall">Lihat Semua Produk</a>
        </div>
      </section>
    </main>

    <script src="../js/variant-modal.js"></script>
    <script src="../js/produk.js" defer></script>
    <script>
      (function () {
        function initThumbDrag() {
          var el = document.getElementById("pdThumbs");
          if (!el || el.dataset.dragReady) return;
          el.dataset.dragReady = "1";

          var isDown = false, startX = 0, startScroll = 0, moved = false;
          el.addEventListener("dragstart", function (e) {
            e.preventDefault();
          });

          el.addEventListener("mousedown", function (e) {
            isDown = true;
            moved = false;
            startX = e.pageX;
            startScroll = el.scrollLeft;
            el.classList.add("is-dragging");
          });
          window.addEventListener("mouseup", function () {
            if (!isDown) return;
            isDown = false;
            el.classList.remove("is-dragging");
          });
          window.addEventListener("blur", function () {
            isDown = false;
            el.classList.remove("is-dragging");
          });
          window.addEventListener("mousemove", function (e) {
            if (!isDown) return;
            e.preventDefault();
            var dx = e.pageX - startX;
            if (Math.abs(dx) > 4) moved = true;
            el.scrollLeft = startScroll - dx;
          });
          el.addEventListener(
            "click",
            function (e) {
              if (moved) {
                e.stopPropagation();
                e.preventDefault();
              }
            },
            true
          );
        }
        document.addEventListener("DOMContentLoaded", initThumbDrag);
        window.addEventListener("load", function () {
          setTimeout(initThumbDrag, 300);
        });
      })();
    </script>
