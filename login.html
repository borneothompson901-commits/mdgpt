<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Admin Panel</title>
<link rel="icon" href="assets/icons/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin-produk.css" />
<style>
  body.login-body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .login-card { width:100%; max-width:340px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:28px 26px; box-shadow:var(--shadow-md); }
  .login-title { font-size:1.05rem; font-weight:700; color:var(--text-1); margin-bottom:2px; }
  .login-sub { font-size:0.8rem; color:var(--text-3); margin-bottom:20px; }
  .login-field { margin-bottom:14px; }
  .login-field label { display:block; font-size:0.78rem; font-weight:600; color:var(--text-2); margin-bottom:5px; }
  .login-field input { width:100%; padding:9px 11px; border:1px solid var(--border-2); border-radius:7px; font-size:0.85rem; font-family:inherit; color:var(--text-1); background:var(--bg); }
  .login-field input:focus { outline:none; border-color:var(--blue); background:var(--surface); }
  .login-btn { width:100%; padding:10px; border:none; border-radius:7px; background:var(--blue); color:#fff; font-weight:600; font-size:0.86rem; cursor:pointer; transition:background var(--t); }
  .login-btn:hover { background:var(--blue-h); }
  .login-btn:disabled { opacity:0.6; cursor:default; }
  .login-error { font-size:0.78rem; color:var(--danger); margin-bottom:12px; display:none; }
</style>
</head>
<body class="login-body" data-public="true">
<div class="overlay" id="overlay"></div>

<form class="login-card" id="loginForm" autocomplete="on">
  <div class="login-title">Masuk Admin</div>
  <div class="login-sub">Login buat kelola produk Linguahub.</div>
  <div class="login-error" id="loginError"></div>
  <div class="login-field">
    <label for="loginEmail">Email</label>
    <input type="email" id="loginEmail" name="email" required autocomplete="username" />
  </div>
  <div class="login-field">
    <label for="loginPassword">Password</label>
    <input type="password" id="loginPassword" name="password" required autocomplete="current-password" />
  </div>
  <button type="submit" class="login-btn" id="loginSubmitBtn">Masuk</button>
</form>

<script src="js/admin-core.js"></script>
<script>
  (function () {
    "use strict";
    // Kalau sudah login, langsung lempar ke halaman tujuan / dashboard.
    AdminShared.auth.getValidSession().then(function (session) {
      if (session) {
        var params = new URLSearchParams(location.search);
        location.href = params.get("next") || "linguahub.html";
      }
    });

    var form = document.getElementById("loginForm");
    var errEl = document.getElementById("loginError");
    var btn = document.getElementById("loginSubmitBtn");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      errEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Memproses...";
      try {
        var email = document.getElementById("loginEmail").value.trim();
        var password = document.getElementById("loginPassword").value;
        await AdminShared.auth.signIn(email, password);
        var params = new URLSearchParams(location.search);
        location.href = params.get("next") || "linguahub.html";
      } catch (err) {
        errEl.textContent = err.message || "Login gagal.";
        errEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Masuk";
      }
    });
  })();
</script>
</body>
</html>
