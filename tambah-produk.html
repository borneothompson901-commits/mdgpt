<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tambah Produk — Admin Panel</title>
<link rel="icon" href="../assets/icons/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin-produk.css" />
</head>
<body class="wizard-mode">

<!-- Navbar minimalis (mengikuti gaya navbar halaman detail produk: tombol kembali, judul, aksi kanan) -->
<div class="wizard-navbar">
  <button class="wizard-navbar__back" id="wizardBackBtn" aria-label="Kembali" title="Kembali ke daftar produk">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
  </button>
  <div class="wizard-navbar__title">
    <span id="wizardTitle">Tambah Produk</span>
    <small id="wizardTypeBadge">Produk Digital</small>
  </div>
  <div class="wizard-navbar__save">
    <button class="btn btn-ghost btn-sm" id="btnSaveDraftTop" type="button">Simpan</button>
  </div>
</div>
<div class="wizard-progress"><div class="wizard-progress__bar" id="wizardProgressBar"></div></div>

<main class="wizard-content">
<div class="wizard-split">

  <div class="wizard-form-col">

    <div class="wizard-steps" id="wizardSteps"><!-- diisi JS sesuai mode --></div>

    <!-- Panel 1-4: dirakit dinamis oleh JS, isinya beda tergantung mode (satu varian / banyak varian) -->
    <div id="wizardPanels"><!-- diisi JS --></div>

    <!-- Panel 5: Review & Simpan (sama untuk semua mode) -->
    <section class="wizard-panel" data-panel="5">
      <div class="wizard-section-title">Review &amp; Simpan</div>
      <div class="wizard-section-sub">Cek lagi datanya sebelum dipublikasikan.</div>

      <div class="review-preview-hero">
        <img id="rvHeroImg" src="" alt="" />
        <div>
          <div class="review-preview-hero__title" id="rvHeroTitle">—</div>
          <div class="review-preview-hero__meta" id="rvHeroMeta">—</div>
        </div>
      </div>

      <div class="review-card">
        <div class="review-card__head">Info Dasar</div>
        <div class="review-card__body">
          <div class="review-row"><span class="review-row__label">Kategori</span><span class="review-row__value" id="rvCategory">—</span></div>
          <div class="review-row"><span class="review-row__label">Tipe</span><span class="review-row__value" id="rvType">—</span></div>
          <div class="review-row" id="rvWeightRow"><span class="review-row__label">Berat</span><span class="review-row__value" id="rvWeight">—</span></div>
          <div class="review-row"><span class="review-row__label">Rating</span><span class="review-row__value" id="rvRating">—</span></div>
          <div class="review-row"><span class="review-row__label">Terjual</span><span class="review-row__value" id="rvSold">—</span></div>
        </div>
      </div>

      <div class="review-card">
        <div class="review-card__head">Harga &amp; Stok</div>
        <div class="review-card__body" id="rvPricingBody"></div>
      </div>

      <div class="review-card">
        <div class="review-card__head">Foto</div>
        <div class="review-card__body" id="rvPhotoBody"></div>
      </div>

      <div class="wizard-footer">
        <button class="btn btn-ghost" data-prev="4">Kembali</button>
        <div class="wizard-footer-right">
          <button class="btn btn-ghost" id="btnSaveDraft" type="button">Simpan Draft</button>
          <button class="btn btn-primary" id="btnPublish" type="button">Publikasikan Produk</button>
        </div>
      </div>
    </section>

  </div>

  <!-- Kolom preview live — tampilan handphone, update otomatis mengikuti isian form -->
  <aside class="wizard-preview-col" id="wizardPreviewCol">
    <div class="preview-sticky">
      <div class="preview-head">
        <span>Live Preview</span>
        <button type="button" class="preview-close-btn" id="previewCloseBtn" aria-label="Tutup preview">
          <svg width="14" height="14" viewBox="0 0 15 15" fill="none"><path d="M11 4L4 11M4 4l7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="phone-frame">
        <div class="phone-notch"></div>
        <div class="phone-screen" id="previewScreen"><!-- diisi JS --></div>
        <div class="phone-home-bar"></div>
      </div>
    </div>
  </aside>

  <button type="button" class="preview-fab" id="previewToggleBtn">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1 8s2.6-5 7-5 7 5 7 5-2.6 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><circle cx="8" cy="8" r="2.1" stroke="currentColor" stroke-width="1.3"/></svg>
    Preview
  </button>

</div>
</main>

<!-- Konfirmasi keluar dari form (ganti confirm() bawaan browser) -->
<div class="modal-backdrop" id="exitConfirmModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Keluar dari Form?</h3>
      <button class="modal-close" id="exitCloseBtn">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M11 4L4 11M4 4l7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <p class="delete-warn">Perubahan yang belum disimpan akan hilang. Yakin mau keluar dari form ini?</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="exitCancelBtn">Batal</button>
      <button class="btn btn-danger" id="exitConfirmBtn">Ya, Keluar</button>
    </div>
  </div>
</div>

<script src="js/admin-core.js"></script>
<script src="js/admin-page.js"></script>
</body>
</html>
