worker_processes 5;
daemon off;
worker_rlimit_nofile 8192;
events {
  worker_connections  4096;  
}
http {
    client_max_body_size 100M;
    include    $!{nginx}/conf/mime.types;
    index    index.html index.htm index.php;
    default_type application/octet-stream;
    log_format   main '$remote_addr - $remote_user [$time_local]  $status '
        '"$request" $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout;
    error_log /dev/stdout;
    sendfile     on;
    tcp_nopush   on;
    server_names_hash_bucket_size 128; 

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;
        absolute_redirect off;

        if ($request_uri ~ ^/(.*/)?index\.html(\?.*)?$) {
            return 301 /$1$2;
        }

        if ($request_uri ~ ^(?!/lingua\.html(?:\?.*)?$)(?!/lingua/affiliate\.html(?:\?.*)?$)(.*)\.html(\?.*)?$) {
            return 301 $1$2;
        }

        $if(NIXPACKS_PHP_ROOT_DIR) (
            root ${NIXPACKS_PHP_ROOT_DIR};
        ) else (
            root /app;
        )

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";

        index index.php;

        charset utf-8;

        $if(IS_LARAVEL) (
            location / {
                try_files $uri $uri/ /index.php?$query_string;
            }
        ) else ()

        $if(NIXPACKS_PHP_FALLBACK_PATH) (
          location / {
            try_files $uri $uri/ ${NIXPACKS_PHP_FALLBACK_PATH}?$query_string;
          }
        ) else ()

        location /lingua/ {
            index index.html;
            try_files $uri $uri.html $uri/ =404;
        }

        location / {
            try_files $uri $uri.html $uri/ =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        $if(IS_LARAVEL) (
            error_page 404 /index.php;
        ) else ()

        location = /lingua.html {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param PHP_VALUE "upload_max_filesize=100M \n post_max_size=100M";
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
            fastcgi_param SCRIPT_FILENAME $document_root/lingua.php;
        }

        location = /lingua/affiliate.html {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param PHP_VALUE "upload_max_filesize=100M \n post_max_size=100M";
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
            fastcgi_param SCRIPT_FILENAME $document_root/lingua/affiliate.php;
        }

        location = /lingua {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param PHP_VALUE "upload_max_filesize=100M \n post_max_size=100M";
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
            fastcgi_param SCRIPT_FILENAME $document_root/lingua.php;
        }

        location = /lingua/affiliate {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param PHP_VALUE "upload_max_filesize=100M \n post_max_size=100M";
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
            fastcgi_param SCRIPT_FILENAME $document_root/lingua/affiliate.php;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param PHP_VALUE "upload_max_filesize=100M \n post_max_size=100M";
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
