    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/store.css" />

  </head>
  <body>
    <main class="page product-page">
      <div class="catalog-toolbar-wrap" id="catalogToolbarWrap">
      <div class="catalog-toolbar" id="catalogToolbar">
        <div class="catalog-toolbar__inner">
          <a href="../lingua" class="catalog-back-btn" id="catalogBackBtn" aria-label="Kembali ke halaman utama">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m12 19-7-7 7-7" />
              <path d="M19 12H5" />
            </svg>
          </a>
          <form class="catalog-search" role="search" action="#" onsubmit="return false;">
            <svg class="catalog-search__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m21 21-4.3-4.3" />
            </svg>
            <input type="search" id="catalogSearchInput" class="catalog-search__input" placeholder="Cari produk digital..." aria-label="Cari produk" />
          </form>

          <button class="catalog-filter-btn" id="filterBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="filterDrawer">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="4" y1="6" x2="20" y2="6" />
              <circle cx="9" cy="6" r="2.3" fill="var(--white)" />
              <line x1="4" y1="12" x2="20" y2="12" />
              <circle cx="16" cy="12" r="2.3" fill="var(--white)" />
              <line x1="4" y1="18" x2="20" y2="18" />
              <circle cx="11" cy="18" r="2.3" fill="var(--white)" />
            </svg>
            <span>Filter</span>
          </button>
          <a href="../lingua/cart.html" class="catalog-cart-btn" id="catalogCartBtn" aria-label="Keranjang belanja">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="9" cy="21" r="1" />
              <circle cx="20" cy="21" r="1" />
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
            </svg>
            <span class="catalog-cart-btn__count" id="catalogCartCount" hidden>0</span>
          </a>
        </div>
      </div>
      </div>
      <div class="catalog-banner-wrap" id="catalogBannerWrap">
        <div class="catalog-banner">
          <img class="catalog-banner__img" src="https://fastly.picsum.photos/id/830/5000/3333.jpg?hmac=oq5nqz20klOJ7ONdU-bEGtDBSEP5mqClKQBhgrxO4UQ" alt="" loading="lazy" />
          <div class="catalog-banner__overlay"></div>
          <h2 class="catalog-banner__text">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="9" cy="21" r="1" />
              <circle cx="20" cy="21" r="1" />
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
            </svg>
            LINGUA STORE
          </h2>
        </div>
      </div>
      <div class="catalog-categories-wrap" id="catalogCategoriesWrap">
      <nav class="catalog-categories" id="catalogCategories" aria-label="Kategori produk">
        <div class="catalog-categories__inner">
          <div class="catalog-categories__scroll">
            <button type="button" class="catalog-cat" data-cat="all" aria-current="true">Semua Produk</button>
          </div>
          <div class="catalog-cat-more" id="catalogCatMore" hidden>
            <button type="button" class="catalog-cat catalog-cat-more__toggle" id="catalogCatMoreToggle" aria-haspopup="true" aria-expanded="false" aria-controls="catalogCatMoreMenu">
              <span id="catalogCatMoreLabel">Lainnya</span>
              <svg class="catalog-cat-more__chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
            <div class="catalog-cat-more__menu" id="catalogCatMoreMenu" role="menu" hidden></div>
          </div>
        </div>
      </nav>
      </div>
      <div class="catalog-loading" id="catalogLoading" role="status" aria-live="polite">
        <span class="catalog-loading__icon">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="21" r="1" />
            <circle cx="20" cy="21" r="1" />
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
          </svg>
        </span>
        <span class="catalog-loading__dots">
          <span></span><span></span><span></span>
        </span>
        <span class="sr-only">Memuat produk...</span>
      </div>
      <section class="catalog-section" id="catalogSection" hidden>
        <div class="catalog-section__inner">
          <div class="catalog-section__meta">
            <span class="catalog-section__count" id="resultCount">Menampilkan produk</span>
            <div class="catalog-sort" id="catalogSort">
              <span class="catalog-sort__label">Urutkan:</span>

              <div class="sort-item" id="sortTerbaruItem">
                <span class="sort-item__label">Terbaru</span>
                <span class="sort-item__arrows">
                  <button type="button" class="sort-item__arrow" data-sort="terbaru" aria-label="Urutkan dari yang terbaru" title="Terbaru">
                    <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l8 10H4z"/></svg>
                  </button>
                  <button type="button" class="sort-item__arrow" data-sort="terlama" aria-label="Urutkan dari yang terlama" title="Terlama">
                    <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20 4 10h16z"/></svg>
                  </button>
                </span>
              </div>

              <div class="sort-item" id="sortTerlarisItem">
                <span class="sort-item__label">Terlaris</span>
                <span class="sort-item__arrows">
                  <button type="button" class="sort-item__arrow" data-sort="terlaris-asc" aria-label="Urutkan dari paling sedikit terjual" title="Paling sedikit terjual">
                    <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l8 10H4z"/></svg>
                  </button>
                  <button type="button" class="sort-item__arrow" data-sort="terlaris-desc" aria-label="Urutkan dari paling laris" title="Paling laris">
                    <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20 4 10h16z"/></svg>
                  </button>
                </span>
              </div>

              <div class="sort-item" id="sortHargaItem">
                <span class="sort-item__label">Harga</span>
                <span class="sort-item__arrows">
                  <button type="button" class="sort-item__arrow" data-sort="termurah" aria-label="Urutkan harga terendah" title="Harga terendah">
                    <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l8 10H4z"/></svg>
                  </button>
                  <button type="button" class="sort-item__arrow" data-sort="termahal" aria-label="Urutkan harga tertinggi" title="Harga tertinggi">
                    <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20 4 10h16z"/></svg>
                  </button>
                </span>
              </div>
            </div>
          </div>

          <div class="explore-grid catalog-grid" id="catalogGrid"></div>
          <div class="catalog-empty" id="catalogEmpty" hidden>
            <p class="catalog-empty__text">Tidak ada produk yang cocok dengan filter kamu</p>
            <button type="button" class="catalog-empty__reset" id="catalogEmptyReset">Reset Filter</button>
          </div>
          <p class="catalog-end" id="catalogEnd">-Sudah semua produk ditampilkan-</p>
        </div>
      </section>
    </main>
    <div class="filter-overlay" id="filterOverlay"></div>
    <aside class="filter-drawer" id="filterDrawer" aria-hidden="true" aria-label="Filter produk">
      <div class="filter-drawer__head">
        <h3>Filter Produk</h3>
        <button class="filter-drawer__close" id="filterCloseBtn" type="button" aria-label="Tutup filter">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="filter-drawer__body">
        <div class="filter-group">
          <h4 class="filter-group__title">Kategori</h4>
          <div id="filterCategoryOptions"></div>
        </div>

        <div class="filter-group">
          <h4 class="filter-group__title">Urutkan</h4>
          <label class="filter-radio"><input type="radio" name="sortOption" value="terbaru" checked /><span>Terbaru</span></label>
          <label class="filter-radio"><input type="radio" name="sortOption" value="terlaris-desc" /><span>Terlaris</span></label>
          <label class="filter-radio"><input type="radio" name="sortOption" value="termurah" /><span>Harga</span></label>
        </div>

        <div class="filter-group">
          <h4 class="filter-group__title">Rentang Harga</h4>
          <div class="price-slider" id="priceSlider">
            <div class="price-slider__track">
              <div class="price-slider__range" id="priceSliderRange"></div>
            </div>
            <input type="range" class="price-slider__input price-slider__input--min" id="priceSliderMin" min="0" max="10000000" step="10000" value="0" aria-label="Harga minimum" />
            <input type="range" class="price-slider__input price-slider__input--max" id="priceSliderMax" min="0" max="10000000" step="10000" value="10000000" aria-label="Harga maksimum" />
          </div>
          <div class="price-fields">
            <label class="price-field">
              <span class="price-field__prefix">Rp</span>
              <input type="text" inputmode="numeric" autocomplete="off" class="price-field__input" id="priceInputMin" value="0" aria-label="Harga minimum kustom" />
            </label>
            <span class="price-fields__sep">s/d</span>
            <label class="price-field">
              <span class="price-field__prefix">Rp</span>
              <input type="text" inputmode="numeric" autocomplete="off" class="price-field__input" id="priceInputMax" value="10.000.000" aria-label="Harga maksimum kustom" />
            </label>
          </div>
        </div>
      </div>

      <div class="filter-drawer__footer">
        <button class="filter-btn-reset" id="filterResetBtn" type="button">Reset</button>
        <button class="filter-btn-apply" id="filterApplyBtn" type="button">Terapkan Filter</button>
      </div>
    </aside>

    <script src="../js/affiliate-tracker.js" defer></script>
    <script src="../js/global.js" defer></script>
    <script src="../js/cart-store.js" defer></script>
    <script src="../js/variant-modal.js" defer></script>
    <script src="../js/product.js" defer></script>
  </body>
</html>
